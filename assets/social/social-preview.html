<!doctype html>
<!-- Source of assets/social-preview.png (GitHub Settings → Social preview). Render: msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640 --screenshot=<repo>/assets/social-preview.png file:///<repo>/assets/social/social-preview.html -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  .wrap { height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 0 80px; text-align: center; }
  .head { display: flex; align-items: center; gap: 28px; }
  .logo { width: 120px; height: 120px; }
  .title { font-size: 104px; }
  .steps { display: flex; align-items: stretch; gap: 18px; margin-top: 26px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 220px; padding: 22px 10px 18px; justify-content: center; border-radius: 22px; background: rgba(255,255,255,.04); border: 2px solid; }
  .step b { font-size: 32px; font-weight: 700; }
  .step span { font-size: 19px; color: #9da7b3; }
  .s1 { border-color: rgba(248,81,73,.55); } .s1 b { color: #F85149; }
  .s2 { border-color: rgba(240,136,62,.55); } .s2 b { color: #F0883E; }
  .s3 { border-color: rgba(210,153,34,.55); } .s3 b { color: #D29922; }
  .s4 { border-color: rgba(63,185,80,.65); background: rgba(63,185,80,.10); } .s4 b { color: #3FB950; }
  .arrow { font-size: 40px; color: #6e7681; align-self: center; }
</style></head>
<body><div class="wrap">
  <div class="head"><img class="logo" src="../logo.svg" alt=""><div class="title">Ritual</div></div>
  <div class="tagline">Claude makes a mistake once. Ritual makes sure it's the last time.</div>
  <div class="steps">
    <div class="step s1"><b>Mistake</b><span>logged as it happens</span></div><div class="arrow">→</div>
    <div class="step s2"><b>Lesson</b><span>with a detector question</span></div><div class="arrow">→</div>
    <div class="step s3"><b>Rule</b><span>a guard that blocks it</span></div><div class="arrow">→</div>
    <div class="step s4"><b>✓ Check</b><span>a test, seen failing first</span></div>
  </div>
  <div class="url" style="margin-top:18px">A Claude Code plugin · github.com/Zurishadday/Ritual</div>
</div></body></html>
