<!doctype html>
<!-- Source of assets/banner.png (README header: the social preview with rounded corners). Render: node assets/social/render.mjs file:///<repo>/assets/social/banner.html <repo>/assets/banner.png -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>html, body { background: none; } .wrap { border-radius: 28px; background: radial-gradient(900px 500px at 15% 10%, rgba(248, 81, 73, .10), transparent 60%), radial-gradient(900px 500px at 90% 100%, rgba(63, 185, 80, .12), transparent 60%), linear-gradient(160deg, #161b22 0%, #0d1117 70%); }</style>
<style>
  .wrap { height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 140px; text-align: center; }
  .head { display: flex; align-items: center; gap: 28px; }
  .logo { width: 120px; height: 120px; }
  .title { font-size: 104px; }
  .steps { display: flex; align-items: stretch; gap: 12px; margin-top: 18px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 186px; padding: 18px 10px 16px; justify-content: center; border-radius: 22px; background: rgba(255,255,255,.04); border: 2px solid; }
  .step b { font-size: 29px; font-weight: 700; }
  .step span { font-size: 17px; color: #9da7b3; line-height: 1.3; }
  .s1 { border-color: rgba(248,81,73,.55); } .s1 b { color: #F85149; }
  .s2 { border-color: rgba(240,136,62,.55); } .s2 b { color: #F0883E; }
  .s3 { border-color: rgba(210,153,34,.55); } .s3 b { color: #D29922; }
  .s4 { border-color: rgba(63,185,80,.65); background: rgba(63,185,80,.10); } .s4 b { color: #3FB950; }
  .arrow { font-size: 34px; color: #6e7681; align-self: center; }
</style></head>
<body><div class="wrap">
  <div class="head"><img class="logo" src="../logo.svg" alt=""><div class="title">Ritual</div></div>
  <div class="tagline">Claude makes a mistake once.<br>Ritual makes sure it's the last time.</div>
  <div class="steps">
    <div class="step s1"><b>Mistake</b><span>logged as it happens</span></div><div class="arrow">→</div>
    <div class="step s2"><b>Lesson</b><span>with a detector question</span></div><div class="arrow">→</div>
    <div class="step s3"><b>Rule</b><span>a guard that blocks it</span></div><div class="arrow">→</div>
    <div class="step s4"><b>✓ Check</b><span>a test, seen failing first</span></div>
  </div>
  <div class="url" style="margin-top:18px">A Claude Code plugin · github.com/Zurishadday/Ritual</div>
</div></body></html>
