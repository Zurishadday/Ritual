name: Share a lesson
description: A mistake an AI made in your project that a lesson could prevent next time, in any project like yours.
title: "Lesson: "
labels: ["lesson"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! The easiest way is `/ritual share` in Claude Code: it makes the lesson generic, checks that it names nothing of your project, and opens this form already filled in.
        A shared lesson must help someone building something else: no clients, products, people or names from your project. Ritual runs on Claude, so a mistake that only happened with another model gets checked with Claude before it goes in ([how](https://github.com/Zurishadday/Ritual/blob/main/simulations/README.md#checking-a-contributed-lesson)).
  - type: input
    id: model
    attributes:
      label: Model
      description: The exact model the mistake happened with (Claude Code shows it in `/model`). Write `~model` if you only remember it.
      placeholder: claude-opus-5-5
    validations:
      required: true
  - type: input
    id: month
    attributes:
      label: Month it happened
      placeholder: 2026-10
    validations:
      required: true
  - type: input
    id: kind
    attributes:
      label: Kind of project
      description: The Ritual packages turned on in your project (`/ritual share` fills it in), or "core only". Nothing that names the project.
      placeholder: web, education
  - type: input
    id: group
    attributes:
      label: Group (what you were doing)
      description: "writing-and-docs, numbers-and-data, tests-and-checks, scripts-and-files, interface-and-design, console-and-tools or git-and-process. See lessons/taxonomy.json."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it goes
      description: "`core` (any project), `package web` (an existing package), `new package <slug>: <what it covers>`, `new group <slug>: <what it covers>`, or `refines <lesson number>`."
      placeholder: core
    validations:
      required: true
  - type: textarea
    id: lesson
    attributes:
      label: The lesson
      description: The five parts, in English if you can (it becomes the original; translations are made from it).
      value: |
        ### Title

        **The idea.**

        **Example.**

        **Detector question.**

        **Warning sign.**

        **What to do.**
    validations:
      required: true
  - type: textarea
    id: transfer
    attributes:
      label: Two other kinds of project it applies to
      description: One line each, saying what the mistake would look like there. If it only makes sense in your project, it is a local lesson, not a shared one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The task or prompt where it happened, short enough to run again in a clean session. No logs, paths or data from your project.
