name: Something doesn't work
description: Ritual does not block, does not show its questions, or a command fails.
labels: ["bug"]
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of /ritual doctor
      description: Type `/ritual doctor` in a Claude Code session in your project and paste what it prints.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Windows, macOS or Linux, and whether you use the terminal, the desktop app or an IDE.
      placeholder: Windows 11, desktop app
    validations:
      required: true
